<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Recipe Hub</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    text-align:center;
}

header{
    background:#ff7043;
    color:white;
    padding:30px;
}

.container{
    width:90%;
    margin:auto;
    padding:20px;
}

.recipe-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:white;
    width:300px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card h3{
    margin:10px;
}

.card p{
    padding:0 15px 15px;
}

button{
    background:#ff7043;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    margin:20px;
}

#recommendation{
    font-size:20px;
    font-weight:bold;
    color:#ff7043;
}
</style>
</head>

<body>

<header>
    <h1>Easy Recipe Hub</h1>
    <p>Simple and Delicious Recipes for Everyone</p>
</header>

<div class="container">

    <h2>Popular Recipes</h2>

    <div class="recipe-grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1512058564366-18510be2db19?w=800" alt="">
            <h3>Kimchi Fried Rice</h3>
            <p>Easy Korean fried rice with kimchi.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=800" alt="">
            <h3>Pasta</h3>
            <p>Classic Italian pasta recipe.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=800" alt="">
            <h3>Pancakes</h3>
            <p>Soft and fluffy breakfast pancakes.</p>
        </div>

    </div>

    <button onclick="recommendRecipe()">
        Recommend a Recipe
    </button>

    <p id="recommendation"></p>

</div>

<script>
function recommendRecipe(){

const recipes = [
"Kimchi Fried Rice",
"Pasta",
"Pancakes"
];

const random =
recipes[Math.floor(Math.random()*recipes.length)];

document.getElementById("recommendation").innerText =
"Today's Recommendation: " + random;
}
</script>

</body>
</html>
